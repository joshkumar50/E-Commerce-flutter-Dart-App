name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Quality Gate & Automated Testing ────────────────────────────────
  lint_and_test:
    name: Lint Analysis & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java 17 (Required for Android Gradle 8+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis (0 Errors / 0 Warnings)
        run: flutter analyze

      - name: Execute Full Test Suite
        run: flutter test --coverage --dart-define=DEMO_MODE=true

  # ─── Job 2: Build Android Release Artifacts (APKs & AABs) ───────────────────
  build_android:
    name: Build Android APKs and Release Bundles
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Setup signing key from repository secrets if configured
      - name: Configure Keystore (Optional CI Secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            echo "keyAlias=$KEY_ALIAS" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
            echo "storeFile=../upload-keystore.jks" >> android/key.properties
            echo "Release keystore configured successfully."
          else
            echo "No CI keystore secret provided. Falling back to build validation."
          fi

      # ─── Build Direct-Install APKs ──────────────────────────────────────────
      - name: Build Customer App APK
        run: flutter build apk --flavor customer -t lib/main.dart --android-skip-build-dependency-validation

      - name: Build Admin App APK
        run: flutter build apk --flavor admin -t lib/main_admin.dart --android-skip-build-dependency-validation

      # ─── Build Play Store App Bundles (AAB) ─────────────────────────────────
      - name: Build Customer App Bundle (AAB)
        run: flutter build appbundle --flavor customer -t lib/main.dart --android-skip-build-dependency-validation

      - name: Build Admin App Bundle (AAB)
        run: flutter build appbundle --flavor admin -t lib/main_admin.dart --android-skip-build-dependency-validation

      - name: Inspect Build Artifacts
        run: |
          ls -la build/app/outputs/flutter-apk/ || true

      # ─── Upload Downloadable APK Artifacts ──────────────────────────────────
      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-apk
          path: build/app/outputs/flutter-apk/*customer*.apk
          retention-days: 30

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-apk
          path: build/app/outputs/flutter-apk/*admin*.apk
          retention-days: 30

      # ─── Upload Play Store AAB Bundles ──────────────────────────────────────
      - name: Upload Customer AAB
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-bundle
          path: build/app/outputs/bundle/*customer*/*.aab
          retention-days: 30

      - name: Upload Admin AAB
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-bundle
          path: build/app/outputs/bundle/*admin*/*.aab
          retention-days: 30

