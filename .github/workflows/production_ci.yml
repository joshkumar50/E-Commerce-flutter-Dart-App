name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ─── Job 1: Quality Gate & Automated Testing ────────────────────────────────
  lint_and_test:
    name: Lint Analysis & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java 17 (Required for Android Gradle 8+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis (0 Errors / 0 Warnings)
        run: flutter analyze

      - name: Execute Full Test Suite
        run: flutter test --coverage --dart-define=DEMO_MODE=true

  # ─── Job 2: Build Android Release Artifacts (APKs & AABs) ───────────────────
  build_android:
    name: Build Android APKs and Release Bundles
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Setup signing key from repository secrets if configured, or use standard deterministic keystore
      - name: Configure Keystore (Deterministic Release Signing)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            echo "keyAlias=$KEY_ALIAS" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
            echo "storeFile=../upload-keystore.jks" >> android/key.properties
            echo "Release keystore configured successfully from secrets."
          else
            echo "Using standard deterministic B-Buys release keystore..."
            echo "" | base64 -d > android/upload-keystore.jks
            echo "keyAlias=bbuys" > android/key.properties
            echo "keyPassword=bbuysStorePassword2025!" >> android/key.properties
            echo "storePassword=bbuysStorePassword2025!" >> android/key.properties
            echo "storeFile=../upload-keystore.jks" >> android/key.properties
            echo "Deterministic release keystore configured successfully."
          fi

      # ─── Build Direct-Install APKs with Incremental Build Numbers ───────────
      - name: Build Customer App APK
        run: flutter build apk --flavor customer -t lib/main.dart --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --android-skip-build-dependency-validation

      - name: Build Admin App APK
        run: flutter build apk --flavor admin -t lib/main_admin.dart --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --android-skip-build-dependency-validation

      # ─── Build Play Store App Bundles (AAB) ─────────────────────────────────
      - name: Build Customer App Bundle (AAB)
        run: flutter build appbundle --flavor customer -t lib/main.dart --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --android-skip-build-dependency-validation

      - name: Build Admin App Bundle (AAB)
        run: flutter build appbundle --flavor admin -t lib/main_admin.dart --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --android-skip-build-dependency-validation

      # ─── Prepare Distribution Artifacts & Version Manifest ───────────────────
      - name: Prepare In-App Auto-Update Release Bundle
        run: |
          mkdir -p build/dist
          CUSTOMER_APK=$(find build/app/outputs/flutter-apk -type f -name "*customer*.apk" | head -n 1)
          cp "$CUSTOMER_APK" build/dist/app-customer-release.apk

          ADMIN_APK=$(find build/app/outputs/flutter-apk -type f -name "*admin*.apk" | head -n 1)
          cp "$ADMIN_APK" build/dist/app-admin-release.apk

          CUSTOMER_SHA256=$(sha256sum build/dist/app-customer-release.apk | awk '{print $1}')
          ADMIN_SHA256=$(sha256sum build/dist/app-admin-release.apk | awk '{print $1}')

          cat <<EOF > build/dist/version.json
          {
            "version_name": "1.0.${{ github.run_number }}",
            "version_code": ${{ github.run_number }},
            "release_tag": "v1.0.${{ github.run_number }}",
            "published_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "release_notes": "Continuous update built from commit ${{ github.sha }}.",
            "customer_apk_url": "https://github.com/joshkumar50/E-Commerce-flutter-Dart-App/releases/latest/download/app-customer-release.apk",
            "customer_sha256": "$CUSTOMER_SHA256",
            "admin_apk_url": "https://github.com/joshkumar50/E-Commerce-flutter-Dart-App/releases/latest/download/app-admin-release.apk",
            "admin_sha256": "$ADMIN_SHA256",
            "force_update": false
          }
          EOF
          cat build/dist/version.json

      # ─── Publish GitHub Release for In-App Auto-Updates ─────────────────────
      - name: Publish In-App Auto-Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "B-Buys Release v1.0.${{ github.run_number }}"
          body: |
            ## 🚀 In-App Auto-Update Release
            This release is automatically queried and installed by running B-Buys mobile apps.

            - **Build Number:** `${{ github.run_number }}`
            - **Commit:** `${{ github.sha }}`
            - **Published:** Automated build from `main`
          files: |
            build/dist/app-customer-release.apk
            build/dist/app-admin-release.apk
            build/dist/version.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── Sync version.json back to main repository (Zero-rate-limit source) ───
      - name: Sync version.json to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp build/dist/version.json ./version.json
          git add version.json
          git commit -m "chore(release): update in-app version manifest to 1.0.${{ github.run_number }} [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Failed to push version.json"

      # ─── Upload Downloadable APK Artifacts ──────────────────────────────────
      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-apk
          path: build/dist/app-customer-release.apk
          retention-days: 30

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-apk
          path: build/dist/app-admin-release.apk
          retention-days: 30

      # ─── Upload Play Store AAB Bundles ──────────────────────────────────────
      - name: Upload Customer AAB
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-bundle
          path: build/app/outputs/bundle/*customer*/*.aab
          retention-days: 30

      - name: Upload Admin AAB
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-bundle
          path: build/app/outputs/bundle/*admin*/*.aab
          retention-days: 30

