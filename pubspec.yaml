name: opem
description: "B-Buys Grocery - Open Source Ecommerce"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.18.0
  sentry_flutter: ^8.10.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # UI
  google_fonts: ^9.0.0
  cached_network_image: ^3.4.1
  flutter_easyloading: ^4.0.2

  # Auth
  google_sign_in: ^6.3.0

  # Media
  image_picker: ^1.1.2

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.3
  crypto: ^3.0.6




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.jpg"
