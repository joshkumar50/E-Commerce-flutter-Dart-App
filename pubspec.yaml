name: opem
description: "B-Buys Grocery - Open Source Ecommerce"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.8.4

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_easyloading: ^3.0.5

  # Auth
  google_sign_in: ^6.2.1

  # Media
  image_picker: ^1.1.2

  # Utilities
  uuid: ^4.5.1
  fluttertoast: ^8.2.12



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
